{

    schedule: "0 0 * * *"
    schedule: ${?BACKUP_SCHEDULE}

    eviction: "0/1d,7d/delete"
    eviction: ${?EVICTION_POLICY}

    storage: ${?STORAGE}

    command: "sleep 20s"

    incremental_command: "sleep 10s"

    restore_command: "sleep 20s"

    incremental_restore_command: "sleep 20s"

    list_instances_in_vault_command: "ls -la {{.data_folder}}"

    incremental_list_instances_in_vault_command: "ls -la {{.data_folder}}"

    must_have_env_vars = []

    custom_vars: [test]
    publish_custom_vars: "true"

    enable_full_restore: "true"
}
